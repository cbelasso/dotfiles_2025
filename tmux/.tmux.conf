# Truecolor support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",screen-256color:Tc"
set-environment -g COLORTERM truecolor
set-environment -g XDG_RUNTIME_DIR "$XDG_RUNTIME_DIR"

set-option -g xterm-keys on

# # Set up a custom key binding in tmux
# unbind -n C-i
# bind-key -n C-i send-keys "\x1b[105;6u"
# unbind-key -n Tab

# Set up a custom key binding in tmux (server side)
# bind-key -n M-i send-keys D-i
# bind-key -n M-o send-keys D-o

set -g prefix C-a
unbind C-b 
bind-key C-a send-prefix
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

# Reload Settings
unbind r
bind r source-file ~/.tmux.conf 

bind -r j resize-pane -D 6
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

# --- Without prefix ---
bind-key -n M-UP swap-window -t +1 \; next-window 
bind-key -n M-DOWN swap-window -t -1 \; previous-window 
bind-key -n M-RIGHT next-window
bind-key -n M-LEFT previous-window

# --- With prefix (Ctrl+a) ---
# bind-key M-Up swap-window -t +1 \; next-window
# bind-key M-Down swap-window -t -1 \; previous-window
# bind-key M-Right next-window
# bind-key M-Left previous-window

bind-key Up swap-window -t +1 \; next-window
bind-key Down swap-window -t -1 \; previous-window
bind-key Right next-window
bind-key Left previous-window

set -g mouse on


bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

set -g base-index 1

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'arcticicestudio/nord-tmux'
# set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux' # My fork that holds the meetings script bc I'm lazy af

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum' 
# set -g @plugin 'fcsonline/tmux-thumbs'
# set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin 'wfxr/tmux-fzf-url'
